name: Verify Site Features

on:
  push:
    branches:
      - feat/articles-livewire
      - feat/library-livewire
      - feat/media-livewire
      - feat/contact-livewire
      - feat/motion-system
      - feat/admin-content-entry-media-curation
      - feat/admin-content-crud
  pull_request:
    branches:
      - main
      - feat/seo-topic-hubs
      - feat/typography-header-brand
      - feat/admin-auth-foundation
      - feat/admin-content-entry-media-curation

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Diagnose Blade compilation during CRUD development
        run: |
          php artisan view:cache
          FILE=$(grep -l 'admin-content-list' storage/framework/views/*.php | head -n 1)
          if [ -n "$FILE" ]; then
            php -l "$FILE" || true
            python3 - "$FILE" <<'PY'
          import re,sys
          src=open(sys.argv[1]).read()
          counts={}
          for x in ['<?php if(', '<?php endif;', '<?php foreach(', '<?php endforeach;', '<?php for(', '<?php endfor;', '<?php while(', '<?php endwhile;']:
              counts[x]=src.count(x)
          print('Blade compiled control-flow counts',counts)
          for i,line in enumerate(src.splitlines(),1):
              if ('<?php if(' in line or '<?php endif;' in line or '<?php foreach(' in line or '<?php endforeach;' in line) and (i > 480):
                  print(str(i)+': '+line[:240])
          PY
            FILE_TO_SCAN="$FILE" php <<'PHP'
          <?php
          $tokens = token_get_all(file_get_contents(getenv('FILE_TO_SCAN')));
          $openers = [T_IF => 'if', T_FOREACH => 'foreach', T_FOR => 'for', T_WHILE => 'while', T_SWITCH => 'switch'];
          $closers = [T_ENDIF => 'if', T_ENDFOREACH => 'foreach', T_ENDFOR => 'for', T_ENDWHILE => 'while', T_ENDSWITCH => 'switch'];
          $stack = [];
          $last = [];
          foreach ($tokens as $i => $token) {
              if (!is_array($token)) continue;
              if (isset($openers[$token[0]])) {
                  $j = $i + 1;
                  while (isset($tokens[$j]) && is_array($tokens[$j]) && $tokens[$j][0] === T_WHITESPACE) $j++;
                  if (($tokens[$j] ?? null) !== '(') continue;
                  $depth = 0;
                  for (; $j < count($tokens); $j++) {
                      if ($tokens[$j] === '(') $depth++;
                      if ($tokens[$j] === ')') {
                          $depth--;
                          if ($depth === 0) break;
                      }
                  }
                  $j++;
                  while (isset($tokens[$j]) && is_array($tokens[$j]) && $tokens[$j][0] === T_WHITESPACE) $j++;
                  if (($tokens[$j] ?? null) === ':') $stack[] = [$openers[$token[0]], $token[2]];
              } elseif (isset($closers[$token[0]])) {
                  $last[] = [$closers[$token[0]], $token[2], count($stack)];
                  if (count($last) > 16) array_shift($last);
                  $top = array_pop($stack);
                  if (!$top || $top[0] !== $closers[$token[0]]) {
                      echo 'Mismatch closing '.token_name($token[0]).' at line '.$token[2].' expecting '.json_encode($top)."\n";
                      echo 'Recent closers '.json_encode($last)."\n";
                      break;
                  }
                  if (count($stack) === 0 && $token[2] >= 530) echo "Stack became empty near line {$token[2]}\n";
              }
          }
          echo 'Remaining stack '.json_encode($stack)."\n";
          PHP
          fi

      - name: Run tests
        run: php artisan test
