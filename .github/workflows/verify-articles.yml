name: Verify Site Features

on:
  push:
    branches:
      - feat/articles-livewire
      - feat/library-livewire
      - feat/media-livewire
      - feat/contact-livewire
      - feat/motion-system
      - feat/admin-content-entry-media-curation
      - feat/admin-content-crud
  pull_request:
    branches:
      - main
      - feat/seo-topic-hubs
      - feat/typography-header-brand
      - feat/admin-auth-foundation
      - feat/admin-content-entry-media-curation

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
